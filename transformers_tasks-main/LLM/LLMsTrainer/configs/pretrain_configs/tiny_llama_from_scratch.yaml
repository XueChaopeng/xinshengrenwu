# [added] Small-scale "train an LLM from scratch" config used on this machine.
# It follows configs/pretrain_configs/llama.yaml but uses a randomly-initialised
# tiny LLaMA (see configs/tiny_llama_model_config.json) instead of OpenLLaMA-7B.
data:
  mode: "pretrain"
  data:
    MNBVC_news: "data/pretrain_data/MNBVC_news/*.jsonl.zst"
    MNBVC_qa: "data/pretrain_data/MNBVC_qa/*.jsonl.zst"
    MNBVC_wiki: "data/pretrain_data/MNBVC_wiki/*.jsonl.zst"
  # sample_policy_file: "configs/sample_policy/pretrain/MNBVC.json"   # [added-config]
  #   left out on purpose: the sample policy divides by the *rounded* (2 decimal)
  #   source size in GB, which is 0 for these tiny demo shards (ZeroDivisionError).
  #   Omitting the key disables source-ratio sampling, as documented in the readme.
  pad_to_max: false
  sequence_sample_mode: "none"
  concat_multiple_sequence: true
  num_sequences: 10
  seq_length: 256
  tokenizer_path: "E:\\nlp\\models\\uer--gpt2-chinese-cluecorpussmall"
  split_by_shard: false
train:
  train_batch_size: 2
  num_training_steps: 100
  num_warmup_steps: 10
  initializer_range: 1.0e-2
  lr: 5.0e-4
  weight_decay: 1.0e-1
  resize_model_vocab_size: false
  ckpt: null
  train_num_workers: 0
  gradient_accumulation_steps: 1
  prefetch_factor: 2
  train_and_eval: true
  gradient_checkpointing_enable: false
  use_lora: false
  target_modules: ['q_proj', 'v_proj']
  save_total_limit: 1
  img_log_dir: "E:\\nlp\\runs\\llms_trainer\\log\\pretrain\\tiny_llama"
  img_log_name: "tiny llama from scratch"
eval:
  eval_methods: ["single_choice_eval", "generation_eval"]
  single_choice_dataset:
    single_choice_file: eval_data/knowledge/knowledge_and_reasoning.jsonl
  generation_dataset:
    general_test: eval_data/pretrain/generation_test.jsonl
  genration_eval_save_path: "E:\\nlp\\runs\\llms_trainer\\eval_while_training\\pretrain\\tiny_llama"
log_interval: 10
eval_interval: 50
save_interval: 100
work_dir: "E:\\nlp\\runs\\llms_trainer\\checkpoints\\pretrain\\tiny_llama"
